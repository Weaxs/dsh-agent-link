x-openai-environment: &openai-environment
  OPENAI_BASE_URL: ${E2E_CONTAINER_OPENAI_BASE_URL}
  OPENAI_API_KEY: ${OPENAI_API_KEY}

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    profiles: [hermes]
    dns: [223.5.5.5, 119.29.29.29]
    extra_hosts: ["${E2E_MODEL_HOST}:${E2E_MODEL_IP}"]
    command: gateway run
    environment:
      <<: *openai-environment
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY}
      API_SERVER_MODEL_NAME: ${OPENAI_MODEL_NAME}
      TERMINAL_ENV: local
    volumes:
      - ./generated/hermes-config.yaml:/opt/data/config.yaml
    healthcheck:
      test:
        [
          "CMD",
          "/opt/hermes/.venv/bin/python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8642),2); s.close()",
        ]
      interval: 3s
      timeout: 3s
      retries: 60

  openclaw:
    image: openclaw/openclaw:latest
    profiles: [openclaw]
    dns: [223.5.5.5, 119.29.29.29]
    extra_hosts: ["${E2E_MODEL_HOST}:${E2E_MODEL_IP}"]
    entrypoint: ["tini", "-s", "--", "node", "openclaw.mjs", "gateway"]
    environment:
      OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json
      OPENCLAW_STATE_DIR: /tmp/openclaw-state
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./generated/openclaw.json:/etc/openclaw/openclaw.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('net').connect(18789,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)",
        ]
      interval: 3s
      timeout: 3s
      retries: 60

  openclaw-approver:
    image: openclaw/openclaw:latest
    profiles: [openclaw]
    network_mode: service:openclaw
    depends_on:
      openclaw:
        condition: service_healthy
    environment:
      OPENCLAW_CONFIG_PATH: /etc/openclaw/openclaw.json
      OPENCLAW_STATE_DIR: /tmp/openclaw-state
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
    volumes:
      - ./scripts/approve-openclaw.mjs:/e2e/approve-openclaw.mjs:ro
    command: ["node", "/e2e/approve-openclaw.mjs"]

  dsh:
    build:
      context: .
      dockerfile: dsh/Dockerfile
    profiles: [dsh]
    dns: [223.5.5.5, 119.29.29.29]
    extra_hosts: ["${E2E_MODEL_HOST}:${E2E_MODEL_IP}"]
    environment:
      OPENAI_BASE_URL: ${E2E_CONTAINER_OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME}
    volumes:
      - ./generated/dsh:/tmp/dsh-e2e
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('net').connect(18790,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)",
        ]
      interval: 3s
      timeout: 3s
      retries: 80

  acp:
    build:
      context: ../..
      dockerfile: .github/e2e/acp/Dockerfile
    profiles: [acp]
    network_mode: service:${E2E_TARGET}
    depends_on:
      - ${E2E_TARGET}
    init: true
    environment:
      AGENT_LINK_NATIVE_KIND: ${E2E_TARGET}
      AGENT_LINK_NATIVE_HOST: 127.0.0.1
      AGENT_LINK_NATIVE_PORT: ${E2E_NATIVE_PORT}
      AGENT_LINK_NATIVE_TOKEN: ${E2E_NATIVE_TOKEN}
      AGENT_LINK_NATIVE_CWD: /tmp
      AGENT_LINK_DSH_PROVIDER: openai
      AGENT_LINK_OPENCLAW_AGENT_ID: main
      AGENT_LINK_REASONING_EFFORT: low
      AGENT_LINK_ACP_HOST: 0.0.0.0
      AGENT_LINK_ACP_PORT: 18792
      AGENT_LINK_ACP_TOKEN: e2e-acp-token
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME}
    volumes:
      - ./generated/dsh:/tmp/dsh-e2e
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18792/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 60
