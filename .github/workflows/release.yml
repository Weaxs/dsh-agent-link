name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      finalize:
        description: Create the GitHub release after both npm packages are approved
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        run: node scripts/sync-version.mjs --check "$RELEASE_TAG"
      - run: npm ci
        if: ${{ !inputs.finalize }}
      - run: npm run check
        if: ${{ !inputs.finalize }}
      - name: Stage scoped package
        if: ${{ !inputs.finalize }}
        run: npx --yes npm@11.20.0 stage publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Stage unscoped package
        if: ${{ !inputs.finalize }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          npm pack --pack-destination "$stage"
          tar -xzf "$stage"/*.tgz -C "$stage"
          cd "$stage/package"
          npm pkg set name=dsh-knot
          sed -i 's|@weaxs/dsh-knot|dsh-knot|g' cordis.patch.yml
          sed -i 's|"@weaxs/dsh-knot"|"dsh-knot"|g' dist/client.js
          grep -Eq 'name: ["'\'']dsh-knot["'\'']' cordis.patch.yml
          test -f dist/index.js
          test -f dist/client.js
          test -f icon.svg
          test -f locale/en.json
          npx --yes npm@11.20.0 stage publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        if: ${{ inputs.finalize }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$(npm view "@weaxs/dsh-knot@$version" version)" = "$version"
          test "$(npm view "dsh-knot@$version" version)" = "$version"
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
