name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Biome
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit and protocol tests
        run: npm test
      - name: Build and package check
        run: npm run build && npm pack --dry-run
